services:
  postgres:
    image: postgres:16-alpine
    container_name: media_ratings_db
    environment:
      POSTGRES_DB: media_ratings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
